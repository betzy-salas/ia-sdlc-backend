# Base de datos: PostgreSQL. Para desarrollo local, levántala con `docker compose up -d`.
server:
  port: ${PORT:8080}

spring:
  application:
    name: ia-sdlc-backend
  datasource:
    url: ${IASDLC_DB_URL:jdbc:postgresql://localhost:5432/iasdlc}
    username: ${IASDLC_DB_USERNAME:iasdlc}
    password: ${IASDLC_DB_PASSWORD:iasdlc}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo administra Flyway.
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

iasdlc:
  agent:
    # Adaptador del puerto AgentRunner. En esta entrega solo existe "simulated".
    runner: simulated
  security:
    jwt:
      # Solo para desarrollo. En cualquier otro ambiente defina IASDLC_JWT_SECRET (mínimo 32 caracteres).
      secret: ${IASDLC_JWT_SECRET:solo-para-desarrollo-cambiar-este-secreto-0123456789}
      expiration-minutes: ${IASDLC_JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${IASDLC_CORS_ALLOWED_ORIGINS:http://localhost:5173}
